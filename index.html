    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Calendar Money",
        "operatingSystem": "Web",
        "applicationCategory": "FinanceApplication",
        "description": "A personal finance app that turns your income and expenses into a calendar, so you can plan your life. See projected balances, track budgets, and understand where your money goes.",
        "url": "https://money.nady4.com/",
        "image": "https://money.nady4.com/assets/docs/landing.png",

          "@type": "Offer",

          "priceCurrency": "USD"

          "name": "nady4",

        }
      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is it free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Calendar Money is a personal project, so you can sign up and start tracking today at no cost."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your account, categories and transactions live on a remote backend so you can log in from any device."
            }
          },
          {
            "@type": "Question",
            "name": "Can I move a transaction to a different day?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Pick up any transaction in the calendar and drop it on the day you want, and the date updates instantly."
            }
          },
          {
            "@type": "Question",
            "name": "Can I make recurring transactions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. When creating a transaction, choose Make it a pattern and it repeats weekly or monthly automatically."
            }
          },
          {
            "@type": "Question",
            "name": "Can I scan receipts instead of typing them?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Upload a photo of an invoice or receipt and the app extracts the transaction with AI. Scans are limited per day and month to keep things fair."
            }
          },
          {
            "@type": "Question",
            "name": "Can I export my data?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can download a CSV backup of all your transactions from the transaction list at any time."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a mobile app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No native app, but Calendar Money works in any browser and can be installed to your home screen like an app."
            }
          },
          {
            "@type": "Question",
            "name": "Can I customize the look?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Switch between dark and light mode and pick an accent color from the account settings."
            }
          }
        ]
      }
    </script>
